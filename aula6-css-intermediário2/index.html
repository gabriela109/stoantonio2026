<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="formulario">
            <h1>Cadastro de usuário</h1>
            <p class="subtitle">Preencha seus dados para criar sua conta.</p>

            <form action="#" method="post">
                <div class="campo campo-largo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="campo">
                    <label for="data-nascimento">Data de nascimento</label>
                    <input type="date" id="data-nascimento" name="data-nascimento" required>
                </div>

                <fieldset class="campo campo-largo">
                    <legend>Sexo</legend>
                    <div class="opcoes">
                        <label><input type="radio" name="sexo" value="feminino" required> Feminino</label>
                        <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                        <label><input type="radio" name="sexo" value="outro"> Outro</label>
                    </div>
                </fieldset>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <select id="cidade" name="cidade" required>
                        <option value="" selected disabled>Escolha sua cidade</option>
                        <option value="londrina">Londrina</option>
                        <option value="ponta-grossa">Ponta Grossa</option>
                        <option value="curitiba">Curitiba</option>
                        <option value="maringa">Maringá</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel" required>
                </div>

                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
</body>
</html>
